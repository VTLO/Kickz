org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# Comma-separated list of ABIs to build native code for.
# (32-bit armeabi-v7a is not supported: chowdsp SIMD code needs 64-bit NEON)
# Override from the command line, e.g. ./gradlew assembleRelease -PchowkickAbis=arm64-v8a
chowkickAbis=arm64-v8a,x86_64
