name: CI-Android

on:
  push:
    branches:
    - main
    - develop
    paths-ignore:
    - 'manual/**'
    - 'sim/**'
    - '*.md'
  pull_request:
    branches:
    - main
    - develop
    paths-ignore:
    - 'manual/**'
    - 'sim/**'
    - '*.md'
  workflow_dispatch:
    inputs:
      abis:
        description: 'Comma-separated list of ABIs to build (armeabi-v7a is not supported)'
        required: false
        default: 'arm64-v8a,x86_64'

env:
  NDK_VERSION: '25.2.9519653'
  CMAKE_VERSION: '3.22.1'

jobs:
  build_android:
    if: contains(toJson(github.event.commits), '***NO_CI***') == false && contains(toJson(github.event.commits), '[ci skip]') == false && contains(toJson(github.event.commits), '[skip ci]') == false
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # JUCE builds its "juceaide" helper for the host machine while configuring,
    # which needs the regular JUCE Linux development headers.
    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
          libxext-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Android NDK and CMake
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-34" "build-tools;34.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chowkick.keystore"
        echo "CHOWKICK_KEYSTORE_PATH=$RUNNER_TEMP/chowkick.keystore" >> "$GITHUB_ENV"

    - name: Build APK
      env:
        CHOWKICK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        CHOWKICK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        CHOWKICK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        abis="${{ github.event.inputs.abis }}"
        bash scripts/android_build.sh assembleRelease -PchowkickAbis="${abis:-arm64-v8a,x86_64}"

    - name: Collect APK
      id: apk
      run: |
        version=$(grep -oP 'project\(ChowKick VERSION \K[0-9.]+' CMakeLists.txt)
        mkdir -p dist
        cp android/app/build/outputs/apk/release/app-release.apk "dist/ChowKick-${version}.apk"
        "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "dist/ChowKick-${version}.apk"
        echo "name=ChowKick-${version}-android" >> "$GITHUB_OUTPUT"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.apk.outputs.name }}
        path: dist/*.apk
        if-no-files-found: error

  smoke_test:
    name: Launch APK on emulator
    needs: build_android
    runs-on: ubuntu-latest

    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install and launch on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: default
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        disable-animations: true
        script: |
          adb install -r dist/*.apk
          adb logcat -c
          adb shell am start -W -n com.chowdsp.chowkick/.MainActivity
          sleep 20
          adb logcat -d > logcat.txt
          adb shell pidof com.chowdsp.chowkick || (echo "ChowKick is not running!"; grep -E "FATAL|AndroidRuntime|DEBUG|libc" logcat.txt | tail -100; exit 1)
          if grep -q "FATAL EXCEPTION\|Fatal signal" logcat.txt; then grep -E -A30 "FATAL EXCEPTION|Fatal signal" logcat.txt; exit 1; fi
          echo "ChowKick launched successfully"
